<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 願景板 | 聽見內心的聲音</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@300;500&family=Noto+Sans+TC:wght@200;300;400;500&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root {
            --soft-bg: #fdfcfb;
            --dream-gradient: linear-gradient(135deg, #fdfcfb 0%, #e2d1c3 100%);
            --accent-indigo: #818cf8;
        }
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--dream-gradient);
            min-height: 100vh;
            color: #4a5568;
            overflow-x: hidden;
        }
        h1, h2, .serif {
            font-family: 'Noto Serif TC', serif;
        }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.5);
            box-shadow: 0 8px 32px rgba(226, 209, 195, 0.3);
        }
        .fade-in {
            animation: fadeIn 1s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .input-elegant {
            background: transparent;
            border-bottom: 1px solid #cbd5e0;
            transition: border-color 0.4s;
        }
        .input-elegant:focus {
            border-bottom: 1px solid #818cf8;
            outline: none;
        }
    </style>
<script type="importmap">
